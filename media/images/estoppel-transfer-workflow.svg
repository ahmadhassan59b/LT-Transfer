<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Estoppel transfer workflow</title>
  <desc id="desc">A professional workflow diagram showing resort verification, record comparison, and document preparation.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5f7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#13233a" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="#f7f4ed"/>
  <rect x="86" y="84" width="1028" height="552" rx="28" fill="url(#surface)" stroke="#dfe5eb" stroke-width="4"/>
  <path d="M258 358h684" stroke="#dfe5eb" stroke-width="10" stroke-linecap="round"/>
  <g filter="url(#softShadow)">
    <rect x="142" y="214" width="250" height="288" rx="22" fill="#fff" stroke="#dfe5eb" stroke-width="3"/>
    <circle cx="267" cy="286" r="48" fill="#eef5f7"/>
    <path d="M242 290l21 21 43-54" fill="none" stroke="#29735c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="190" y="386" fill="#123456" font-family="Arial, sans-serif" font-size="28" font-weight="700">Request</text>
    <text x="190" y="424" fill="#627084" font-family="Arial, sans-serif" font-size="18">Resort verification</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="475" y="214" width="250" height="288" rx="22" fill="#fff" stroke="#dfe5eb" stroke-width="3"/>
    <circle cx="600" cy="286" r="48" fill="#eef5f7"/>
    <rect x="568" y="260" width="64" height="12" rx="6" fill="#1d6fa5"/>
    <rect x="568" y="286" width="64" height="12" rx="6" fill="#123456"/>
    <rect x="568" y="312" width="64" height="12" rx="6" fill="#c99735"/>
    <text x="526" y="386" fill="#123456" font-family="Arial, sans-serif" font-size="28" font-weight="700">Compare</text>
    <text x="526" y="424" fill="#627084" font-family="Arial, sans-serif" font-size="18">Owner and resort records</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="808" y="214" width="250" height="288" rx="22" fill="#fff" stroke="#dfe5eb" stroke-width="3"/>
    <circle cx="933" cy="286" r="48" fill="#eef5f7"/>
    <rect x="902" y="254" width="62" height="72" rx="8" fill="#123456"/>
    <rect x="916" y="272" width="34" height="6" rx="3" fill="#fff"/>
    <rect x="916" y="292" width="34" height="6" rx="3" fill="#fff" opacity=".65"/>
    <text x="860" y="386" fill="#123456" font-family="Arial, sans-serif" font-size="28" font-weight="700">Prepare</text>
    <text x="860" y="424" fill="#627084" font-family="Arial, sans-serif" font-size="18">Accurate transfer documents</text>
  </g>
</svg>
